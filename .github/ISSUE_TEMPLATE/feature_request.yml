name: Suggest a feature
description: Describe a Mac task you want Switchboard to help with.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Switchboard help?
      description: Describe the behaviour you would like. Examples or sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: Any workaround or other tool, if relevant.
